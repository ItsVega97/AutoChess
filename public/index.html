<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Nakama Royale</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏴‍☠️</text></svg>" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- ================= INICIAR SESIÓN =================
     La ilustracion ya trae el cartel y el boton azul pintados. Encima se pone
     el boton de verdad de Google, invisible y del mismo tamano, para que al
     tocar el dibujo se abra el login sin romper el arte. -->
<section id="screen-login" class="screen active">
  <div class="lienzo login-lienzo" id="login-lienzo">
    <div class="l-google" id="google-btn-box"><div id="google-btn"></div></div>
    <div class="l-aviso hidden" id="login-aviso"></div>
    <button id="btn-login-guest" class="l-invitado">Entrar sin cuenta</button>
  </div>
</section>

<!-- ================= ELEGIR NOMBRE E ICONO =================
     Solo la primera vez. Se usa el mismo pergamino del inicio, tapando por
     dentro lo que trae pintado. -->
<section id="screen-perfil" class="screen">
  <div class="lienzo login-lienzo" id="perfil-lienzo">
    <div class="p-panel">
      <h2 class="p-titulo">TU FICHA DE PIRATA</h2>
      <p class="p-sub">Así te van a buscar los Marines</p>
      <div class="p-campo">
        <span class="p-calavera">☠</span>
        <input id="input-perfil-name" maxlength="16" placeholder="Nombre de pirata" autocomplete="off" />
      </div>
      <div class="p-etiqueta">ELIGE TU ICONO</div>
      <div class="p-iconos" id="perfil-iconos"></div>
      <div class="p-error hidden" id="perfil-error"></div>
      <button id="btn-perfil-ok" class="p-ok">⚓ ZARPAR</button>
    </div>
  </div>
</section>

<!-- ================= PANTALLA DE INICIO =================
     Es la ilustracion del puerto: el titulo, el letrero y los botones estan
     pintados en ella, y encima van los controles de verdad, colocados en
     pixeles del dibujo (1024x1536). game.js escala el conjunto a la pantalla. -->
<section id="screen-menu" class="screen">
  <div class="lienzo menu-lienzo" id="menu-lienzo">
    <div class="m-nombre">
      <span class="m-calavera">☠</span>
      <input id="input-name" maxlength="16" placeholder="Tu nombre" />
      <img class="m-icono hidden" id="menu-icono" alt="" />
    </div>
    <button id="btn-logout" class="m-salir hidden">Cerrar sesión</button>

    <button class="m-zona m-modo1 mode-opt active" data-mode="1v1" aria-label="Modo 1 contra 1"></button>
    <button class="m-zona m-modo2 mode-opt" data-mode="4p" aria-label="Modo 4 piratas"></button>

    <button id="btn-play-online" class="m-zona m-online" aria-label="Jugar online"></button>
    <button id="btn-play-ai" class="m-zona m-cpu" aria-label="Jugar contra la CPU"></button>
    <button id="btn-wiki" class="m-zona m-wiki" aria-label="Wiki Pirata"></button>
    <button id="btn-rankings" class="m-zona m-rank" aria-label="Ránkings"></button>

    <div id="queue-status" class="m-cola hidden">
      <div class="spinner"></div>
      <span id="queue-text">Buscando rival...</span>
      <button id="btn-cancel-queue" class="m-cancelar">Cancelar</button>
    </div>
    <button id="btn-fill-bots" class="m-bots hidden">▶️ Empezar con bots</button>
  </div>
</section>

<!-- ================= RANKINGS =================
     Las divisiones y la cabecera de la tabla estan pintadas en la ilustracion;
     encima se dibujan las filas de verdad, tapando las de ejemplo. -->
<section id="screen-rankings" class="screen">
  <div class="lienzo rank-lienzo" id="rank-lienzo">
    <div class="r-tabla" id="rankings-list"></div>
    <button id="btn-rankings-back" class="r-volver" aria-label="Volver"></button>
  </div>
</section>

<!-- ================= WIKI PIRATA =================
     Misma idea que el inicio: la ilustracion manda y encima van las dos
     columnas de verdad, colocadas sobre los paneles pintados. -->
<section id="screen-wiki" class="screen">
  <div class="lienzo wiki-lienzo" id="wiki-lienzo">
    <button id="btn-wiki-back" class="w-volver" aria-label="Volver"></button>
    <div class="w-lista" id="wiki-crews"></div>
    <div class="w-detalle" id="wiki-detalle"></div>
  </div>
</section>

<!-- ================= PANTALLA DE CARGA ================= -->
<section id="screen-loading" class="screen">
  <div class="menu-card">
    <h1 class="logo">Nakama<span> Royale</span></h1>
    <div class="loading-block">
      <div class="spinner spinner-big"></div>
      <p class="loading-text">¡Rival encontrado! Cargando partida...</p>
      <p class="loading-opponent" id="loading-opponent"></p>
    </div>
  </div>
</section>

<!-- ================= PANTALLA DE JUEGO =================
     La escena 3D ocupa toda la pantalla y la interfaz va SUPERPUESTA encima
     (estilo Tactics Royale). Antes se apilaban en vertical y, sumando barras
     del navegador, nunca cabia todo. -->
<section id="screen-game" class="screen">
  <div id="board-3d"></div>

  <header class="hud ui-layer">
    <div class="hud-player me">
      <span class="hud-name" id="hud-my-name">Tú</span>
      <span class="hud-hp">❤️ <b id="hud-my-hp">12</b></span>
      <span class="hud-gold">🪙 <b id="hud-my-gold">10</b></span>
      <span class="hud-level" title="Tropas en cubierta">⚔️ <b id="hud-my-level">0/1</b></span>
    </div>
    <div class="hud-center">
      <div class="hud-phase" id="hud-phase">Preparación</div>
      <div class="hud-timer" id="hud-timer">30</div>
      <div class="hud-round">Ronda <span id="hud-round">1</span></div>
    </div>
    <div class="hud-standings hidden" id="table-standings"></div>
    <div class="hud-player opp">
      <span class="hud-name" id="hud-opp-name">Rival</span>
      <span class="hud-hp">❤️ <b id="hud-opp-hp">12</b></span>
      <span class="hud-level" title="Tropas del rival">⚔️ <b id="hud-opp-level">1</b></span>
    </div>
  </header>

  <div class="battle-banner hidden ui-layer" id="battle-banner"></div>
  <div class="toast hidden ui-layer" id="toast"></div>

  <aside class="synergies-panel ui-layer">
    <div id="synergy-list" class="synergy-list"></div>
  </aside>

  <div class="bottom-ui ui-layer">
    <div class="action-row">
      <div class="bench" id="bench"></div>
      <div class="sell-zone" id="sell-zone" title="Vender la ficha seleccionada"><span class="sz-txt">Vender</span></div>
    </div>
    <div id="shop" class="shop"></div>
  </div>
</section>

<!-- ================= FIN DE PARTIDA ================= -->
<section id="screen-end" class="screen">
  <div class="menu-card">
    <h1 id="end-title" class="logo">¡Victoria!</h1>
    <p id="end-subtitle" class="subtitle">Has ganado la partida</p>
    <button id="btn-restart" class="btn btn-primary">Jugar de nuevo</button>
  </div>
</section>

<div id="tooltip" class="tooltip hidden"></div>
<div id="reconnect-overlay" class="reconnect-overlay hidden">
  <div class="spinner"></div>
  <span>Reconectando...</span>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="/socket.io/socket.io.js"></script>
<script type="module" src="js/game.js"></script>
</body>
</html>
